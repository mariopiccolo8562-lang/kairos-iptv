<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, user-scalable=no">
<title>Kairos Player</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>
<video id="video"></video>
<div id="avbox"><object id="av-player" type="application/avplayer"></object></div>
<div id="osd"></div>
<div id="toast"></div>
<!-- solo sui TV Samsung: la libreria di sistema per il lettore AVPlay (sugli altri non esiste e non viene chiesta) -->
<script>if (typeof window.tizen !== 'undefined') document.write('<script src="$WEBAPIS/webapis/webapis.js"><\/script>');</script>
<!-- solo sui TV LG: la libreria ufficiale webOSTV.js (Apache 2.0), per il tasto Indietro e per il servizio interno che scarica la lista -->
<script>if (typeof window.PalmSystem !== 'undefined') document.write('<script src="webOSTVjs-1.2.13/webOSTV.js"><\/script>');</script>
<!-- codice QR per «Dal telefono»: facoltativo, sui TV più vecchi resta solo il codice scritto -->
<script src="js/qr.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
