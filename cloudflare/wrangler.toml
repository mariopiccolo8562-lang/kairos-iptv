name = "kairos-panel"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true   # il vecchio indirizzo resta acceso finché tutte le app non sono passate al dominio
# dominio del pannello (deve essere un sito del tuo account Cloudflare)
# store-k.download: dominio dei soli download (DL_HOSTS più sotto, README §34) — lì niente pannello né API.
# Tenere «routes» su UNA riga: se un dominio non si collega, il workflow la toglie con sed e pubblica senza.
routes = [{ pattern = "panel-kairos.com", custom_domain = true }, { pattern = "store-k.download", custom_domain = true }, { pattern = "www.store-k.download", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
# Ogni richiesta passa dal Worker: intestazioni di sicurezza (CSP) e cache dei file del pannello, controllo di Cloudflare
# Access su /panel/, CORS di /app/ per l'aggiornamento della Pro. Tiene anche privati i file di public/privato/
# (disegni dei temi, letti dal Worker con env.ASSETS solo per i clienti che li hanno): non sostituirlo con un elenco di percorsi.
run_worker_first = true

# Il Worker gira vicino al database: D1 sta a Chicago (ORD, regione ENAM) e prima ogni lettura del database faceva
# andata e ritorno Italia ↔ Chicago (~110 ms), 3-10 volte per richiesta. Così la richiesta fa un solo viaggio (dentro
# la rete Cloudflare) e le letture del database diventano di pochi millisecondi. Azure «North Central US» = Chicago.
[placement]
region = "azure:northcentralus"

[[d1_databases]]
binding = "DB"
database_name = "kairos-iptv-db"
database_id = "REPLACE_WITH_D1_ID"   # lo compila da solo la GitHub Action al primo deploy
migrations_dir = "migrations"

# Rate limiting nativo di Cloudflare
[[ratelimits]]
name = "RL_LOGIN"
namespace_id = "7101"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_DEVICE"
namespace_id = "7102"
simple = { limit = 30, period = 60 }

# battiti delle app: per IP solo un tetto alto anti-abuso (il limite vero è per dispositivo, su RL_DEVICE)
[[ratelimits]]
name = "RL_HB"
namespace_id = "7103"
simple = { limit = 600, period = 60 }

# Pulizia notturna (sessioni scadute, log vecchi, dispositivi abbandonati)
# Il secondo cron tiene vivo l'accesso MirkoTeam/ORCP ogni sei ore
[triggers]
crons = ["17 3 * * *", "41 */6 * * *"]

[observability]
enabled = true

# Le variabili ACCESS_TEAM_DOMAIN, ACCESS_AUD e TURNSTILE_SITEKEY vengono passate
# dalla GitHub Action (variabili del repository). I segreti ENC_KEY, ADMIN_BOOTSTRAP_PASS
# e TURNSTILE_SECRET vengono caricati come "secrets" del Worker.

[vars]
# Dominio dedicato ai download (README §34): su questi host il Worker serve solo /get/… (APK e feed degli aggiornamenti)
# e /store/… (pagina dello store); «/» porta allo store e tutto il resto risponde 404 (niente pannello, API, accesso).
# Nomi separati da virgola. Il dominio va collegato al Worker a parte (riga in «routes», vedi README §34).
DL_HOSTS = "store-k.download,www.store-k.download"
