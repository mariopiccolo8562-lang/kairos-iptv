name: Pannello Cloudflare

on:
  push:
    branches: [main]
    paths: ['cloudflare/**', 'player/**', '.github/workflows/cloudflare.yml']
  workflow_dispatch:

concurrency: cloudflare-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STORE_REPO: ${{ vars.STORE_REPO || format('{0}/kairos-store', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa Wrangler
        run: npm install -g wrangler@4

      - name: Controlli
        env:
          ENC_KEY: ${{ secrets.ENC_KEY }}
          ADMIN_BOOTSTRAP_PASS: ${{ secrets.ADMIN_BOOTSTRAP_PASS }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Manca il secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Manca il secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [ -n "$ENC_KEY" ] || { echo "::error::Manca il secret ENC_KEY (esegui il workflow 'Prepara segreti')"; exit 1; }
          [ -n "$ADMIN_BOOTSTRAP_PASS" ] || { echo "::error::Manca il secret ADMIN_BOOTSTRAP_PASS"; exit 1; }

      - name: Database D1
        run: |
          ID=$(wrangler d1 list --json | jq -r '.[] | select(.name=="kairos-iptv-db") | .uuid')
          if [ -z "$ID" ]; then
            wrangler d1 create kairos-iptv-db
            ID=$(wrangler d1 list --json | jq -r '.[] | select(.name=="kairos-iptv-db") | .uuid')
          fi
          [ -n "$ID" ] || { echo "::error::Impossibile creare/trovare il database D1"; exit 1; }
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.toml
          wrangler d1 migrations apply kairos-iptv-db --remote

      - name: Interfaccia dell'app per l'aggiornamento automatico
        run: |
          mkdir -p public/app
          cp ../player/index.html public/app/index.html
          echo "UI_VERSION=$(sha256sum ../player/index.html | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Versione nei link dei file del pannello (il browser li tiene in memoria finché non cambiano)
        run: |
          cd public/panel
          for f in *.js; do
            H=$(sha256sum "$f" | cut -c1-12)
            sed -i "s#src=\"$f\"#src=\"$f?v=$H\"#" index.html
          done
          grep -c '?v=' index.html

      - name: Pubblica il Worker
        env:
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          TWILIO_FROM: ${{ vars.TWILIO_FROM }}
        run: |
          ARGS=()
          for V in ACCESS_TEAM_DOMAIN ACCESS_AUD TURNSTILE_SITEKEY OWNER_EMAIL MAIL_FROM TWILIO_FROM; do
            [ -n "${!V}" ] && ARGS+=(--var "$V:${!V}")
          done
          ARGS+=(--var "UI_VERSION:${UI_VERSION}")
          ARGS+=(--var "APK_FEED:https://github.com/${STORE_REPO}/releases/download/kairos-tv/kairos-tv.json")
          dep() { wrangler deploy "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"; }
          if ! dep; then
            # posizionamento vicino al database non accettato (versione di Wrangler o piano): si pubblica senza, come prima
            if grep -qi 'placement' "$RUNNER_TEMP/deploy.log"; then
              echo "::warning::Cloudflare non ha accettato il posizionamento vicino al database ([placement] in wrangler.toml): pubblicato senza, il pannello resta più lento."
              sed -i '/^\[placement\]/,/^$/d' wrangler.toml
              if dep; then exit 0; fi
            fi
            # il dominio non è ancora nel tuo account Cloudflare (o il token non può collegarlo): si pubblica sul vecchio indirizzo
            echo "::warning::Dominio panel-kairos.com non collegato: aggiungilo al tuo account Cloudflare (Add a domain) e dai al token il permesso Zone → Workers Routes → Edit. Pubblicato sul vecchio indirizzo."
            sed -i '/^routes = \[/d' wrangler.toml
            wrangler deploy "${ARGS[@]}"
          fi

      - name: Carica i segreti
        env:
          ENC_KEY: ${{ secrets.ENC_KEY }}
          ADMIN_BOOTSTRAP_PASS: ${{ secrets.ADMIN_BOOTSTRAP_PASS }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORBIX_KEY: ${{ secrets.ORBIX_KEY }}
          MAXPLAYER_KEY: ${{ secrets.MAXPLAYER_KEY }}
          ARMADA_KEY: ${{ secrets.ARMADA_KEY }}
          STORM_KEY: ${{ secrets.STORM_KEY }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # facoltativo: token GitHub a grana fine, sola lettura di «Contents» dei repository delle app (README §34).
          # Con il token il pannello scarica APK, feed e pagina dello store dall'API GitHub, anche con i repository privati
          GH_RELEASES_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: |
          umask 077
          jq -n --arg a "$ENC_KEY" --arg b "$ADMIN_BOOTSTRAP_PASS" --arg c "$TURNSTILE_SECRET" --arg d "$RESEND_KEY" --arg e "$TMDB_KEY" --arg f "$GEMINI_API_KEY" --arg g "$ANTHROPIC_API_KEY" --arg h "$ORBIX_KEY" --arg i "$MAXPLAYER_KEY" --arg j "$TWILIO_SID" --arg k "$TWILIO_TOKEN" --arg l "$TELEGRAM_BOT_TOKEN" --arg m "$ARMADA_KEY" --arg n "$STORM_KEY" --arg o "$GH_RELEASES_TOKEN" \
            '{ENC_KEY:$a, ADMIN_BOOTSTRAP_PASS:$b, TURNSTILE_SECRET:$c, RESEND_KEY:$d, TMDB_KEY:$e, GEMINI_API_KEY:$f, ANTHROPIC_API_KEY:$g, ORBIX_KEY:$h, MAXPLAYER_KEY:$i, TWILIO_SID:$j, TWILIO_TOKEN:$k, TELEGRAM_BOT_TOKEN:$l, ARMADA_KEY:$m, STORM_KEY:$n, GH_TOKEN:$o} | with_entries(select(.value != ""))' > "$RUNNER_TEMP/s.json"
          wrangler secret bulk "$RUNNER_TEMP/s.json"
          rm -f "$RUNNER_TEMP/s.json"
