name: App Android (APK)

on:
  push:
    branches: [main]
    paths: ['android/**', 'player/**', '.github/workflows/android.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # solo un indicatore (sì/no): il token vero è visibile soltanto al passaggio che pubblica l'APK
      HAS_STORE_TOKEN: ${{ secrets.STORE_TOKEN != '' }}
      STORE_REPO: ${{ vars.STORE_REPO || format('{0}/kairos-store', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Copia il player nell'app
        env:
          KAIROS_SERVER_URL: ${{ vars.KAIROS_SERVER_URL }}
        run: |
          mkdir -p android/app/src/main/assets/www
          cp player/index.html android/app/src/main/assets/www/index.html
          URL="${KAIROS_SERVER_URL%/}"
          UIV=$(sha256sum player/index.html | cut -c1-12)
          printf 'window.KAIROS_SERVER = %s;\nwindow.KX_UI = "%s";\n' "$(jq -Rn --arg u "$URL" '$u')" "$UIV" > android/app/src/main/assets/www/config.js
          if [ -z "$URL" ]; then echo "::warning::Variabile KAIROS_SERVER_URL non impostata: l'app partirà in modalità demo"; fi

      - name: Chiave di firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Nessuna chiave di firma: APK firmato con chiave temporanea (gli aggiornamenti non si installeranno sopra). Esegui il workflow 'Prepara segreti'."
          fi

      - name: Versione
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            V="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))   # es. 1.3.0 → 10300
          else
            V="0.0.${GITHUB_RUN_NUMBER}"; CODE=${GITHUB_RUN_NUMBER}                          # build di prova
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Compila APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_NAME: ${{ vars.APP_NAME }}
          APP_ID: ${{ vars.APP_ID }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/release/app-release.apk kairos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kairos-apk-${{ env.VERSION_NAME }}
          path: kairos.apk

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kairos.apk
          make_latest: true
          generate_release_notes: true

      # Aggiornamento automatico: copia l'APK in una release fissa ("kairos-tv") del repository PUBBLICO dello store.
      # Il pannello legge kairos-tv.json e tutte le app installate propongono l'aggiornamento da sole.
      - name: Pubblica l'APK per l'aggiornamento automatico
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_STORE_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.STORE_TOKEN }}
        run: |
          cp kairos.apk kairos-tv.apk
          URL="https://github.com/${STORE_REPO}/releases/download/kairos-tv/kairos-tv.apk"
          jq -n --arg v "$VERSION_NAME" --argjson c "$VERSION_CODE" --arg u "$URL" --arg d "$(date -u +%FT%TZ)" \
            '{version:$v, versionCode:$c, url:$u, date:$d}' > kairos-tv.json
          cat kairos-tv.json
          if ! gh release view kairos-tv -R "$STORE_REPO" >/dev/null 2>&1; then
            gh release create kairos-tv -R "$STORE_REPO" --title "Kairos Pro" --notes "App Kairos Pro: questa release viene aggiornata automaticamente a ogni nuova versione." --latest=false
          fi
          gh release upload kairos-tv kairos-tv.apk kairos-tv.json -R "$STORE_REPO" --clobber
          echo "::notice::APK $VERSION_NAME pubblicato: $URL"

      - name: Promemoria aggiornamento automatico
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_STORE_TOKEN != 'true'
        run: |
          echo "::warning::Segreto STORE_TOKEN non impostato, l'APK non è stato pubblicato sullo store e le app non si aggiorneranno da sole (vedi README, Aggiornamento automatico)"
