name: Diagnosi pannello (solo numeri)

# Repository pubblico: lo script stampa solo percentuali e tempi, mai IP, nomi, codici o ID.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/diag/**']

concurrency: diag

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installa Wrangler
        run: npm install -g wrangler@4 > /dev/null 2>&1
      - name: Database
        run: |
          ID=$(wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="kairos-iptv-db") | .uuid')
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.toml
      - name: Diagnosi
        run: node ../.github/diag/diag.mjs
